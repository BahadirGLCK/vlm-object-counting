<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLM Object Counting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>

    <main class="page-shell">
      <section class="hero card fade-in-1">
        <p class="eyebrow">VLM Endpoint Client</p>
        <h1>Video Object Counting</h1>
        <p class="subtitle">
          Upload one video and your SFT prompt, then send sampled frames to your served model.
          The result panel shows only the model response.
        </p>
      </section>

      <form id="inferForm" class="layout-grid" enctype="multipart/form-data">
        <section class="card panel fade-in-2">
          <h2>Inputs</h2>

          <label class="field">
            <span>Video File</span>
            <input id="video" name="video" type="file" accept="video/*" required />
          </label>

          <label class="field">
            <span>Prompt File (.txt)</span>
            <input id="promptFile" name="prompt_file" type="file" accept=".txt" />
          </label>

          <label class="field">
            <span>Prompt Content</span>
            <textarea id="promptText" name="prompt_text" rows="14">{{ default_prompt | e }}</textarea>
          </label>
        </section>

        <section class="card panel fade-in-3">
          <h2>Endpoint</h2>

          <label class="field">
            <span>Endpoint URL</span>
            <input
              id="endpoint"
              name="endpoint_url"
              type="text"
              value="{{ default_endpoint | e }}"
              placeholder="http://127.0.0.1:18080 or https://your-host/v1/chat/completions"
              required
            />
          </label>

          <label class="field">
            <span>Model</span>
            <input
              id="model"
              name="model_name"
              type="text"
              value="{{ default_model | e }}"
              required
            />
          </label>

          <label class="field">
            <span>API Key (optional)</span>
            <input id="apiKey" name="api_key" type="password" value="{{ default_api_key | e }}" />
          </label>

          <label class="field">
            <span>Basic Auth Username (optional)</span>
            <input
              id="basicUsername"
              name="basic_username"
              type="text"
              value="{{ default_basic_username | e }}"
              placeholder="gateway username"
            />
          </label>

          <label class="field">
            <span>Basic Auth Password (optional)</span>
            <input
              id="basicPassword"
              name="basic_password"
              type="password"
              value="{{ default_basic_password | e }}"
              placeholder="gateway password"
            />
          </label>

          <label class="field">
            <span>Auth Mode</span>
            <select id="authMode" name="auth_mode">
              <option value="auto" {% if default_auth_mode == "auto" %}selected{% endif %}>Auto (Bearer + X-API-Key)</option>
              <option value="bearer" {% if default_auth_mode == "bearer" %}selected{% endif %}>Bearer</option>
              <option value="x-api-key" {% if default_auth_mode == "x-api-key" %}selected{% endif %}>X-API-Key</option>
              <option value="basic" {% if default_auth_mode == "basic" %}selected{% endif %}>Basic (username/password)</option>
              <option value="none" {% if default_auth_mode == "none" %}selected{% endif %}>None</option>
            </select>
          </label>

          <label class="field">
            <span>API Style</span>
            <select id="apiStyle" name="api_style">
              <option value="openai" {% if default_api_style == "openai" %}selected{% endif %}>OpenAI-Compatible (vLLM)</option>
              <option value="native" {% if default_api_style == "native" %}selected{% endif %}>Ollama Native</option>
              <option value="auto" {% if default_api_style == "auto" %}selected{% endif %}>Auto Detect</option>
            </select>
          </label>

          <label class="field">
            <span>Response Format</span>
            <select id="responseJsonOnly" name="response_json_only">
              <option value="1" {% if default_response_json_only %}selected{% endif %}>JSON Object (recommended)</option>
              <option value="0" {% if not default_response_json_only %}selected{% endif %}>Plain Text</option>
            </select>
          </label>

          <details class="advanced">
            <summary>Preprocessing and Inference Settings</summary>
            <div class="settings-grid">
              <label class="field compact">
                <span>Sampled Frames</span>
                <div class="range-wrap">
                  <input id="frameLimit" name="frame_limit" type="range" min="4" max="40" step="1" value="25" />
                  <output for="frameLimit" id="frameLimitOut">25</output>
                </div>
              </label>

              <label class="field compact">
                <span>Max Frame Side (px)</span>
                <div class="range-wrap">
                  <input id="maxSide" name="max_side" type="range" min="480" max="1920" step="32" value="1024" />
                  <output for="maxSide" id="maxSideOut">1024</output>
                </div>
              </label>

              <label class="field compact">
                <span>JPEG Quality</span>
                <div class="range-wrap">
                  <input id="jpegQuality" name="jpeg_quality" type="range" min="55" max="100" step="1" value="85" />
                  <output for="jpegQuality" id="jpegQualityOut">85</output>
                </div>
              </label>

              <label class="field compact">
                <span>Temperature</span>
                <div class="range-wrap">
                  <input id="temperature" name="temperature" type="range" min="0" max="1" step="0.05" value="0.2" />
                  <output for="temperature" id="temperatureOut">0.2</output>
                </div>
              </label>

              <label class="field compact">
                <span>Max Output Tokens</span>
                <div class="range-wrap">
                  <input id="maxOutputTokens" name="max_output_tokens" type="range" min="32" max="2048" step="32" value="256" />
                  <output for="maxOutputTokens" id="maxOutputTokensOut">256</output>
                </div>
              </label>

              <label class="field compact">
                <span>Timeout (seconds)</span>
                <div class="range-wrap">
                  <input id="timeout" name="timeout_seconds" type="range" min="30" max="1800" step="30" value="600" />
                  <output for="timeout" id="timeoutOut">600</output>
                </div>
              </label>
            </div>
          </details>

          <div class="actions">
            <button id="runButton" type="submit" class="btn btn-primary">Run Counting</button>
            <button id="resetButton" type="reset" class="btn btn-secondary">Reset</button>
          </div>
        </section>
      </form>

      <section class="card panel response fade-in-4">
        <div class="response-header">
          <h2>Model Response</h2>
          <span id="statusBadge" class="badge idle">Idle</span>
        </div>
        <pre id="responseText" aria-live="polite"></pre>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
